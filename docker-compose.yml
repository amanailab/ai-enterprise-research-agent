services:

  # ==========================================================
  # POSTGRESQL
  # ==========================================================

  postgres:

    image: postgres:17

    container_name: fde-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: enterprise_research
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d enterprise_research"
        ]

      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # BACKEND
  # ==========================================================

  backend:

    build:
      context: ./backend

    container_name: fde-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:

      ENVIRONMENT: docker

      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/enterprise_research

      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY}

      NEWS_API_KEY: ${NEWS_API_KEY}

      GROQ_API_KEY: ${GROQ_API_KEY}

      TAVILY_API_KEY: ${TAVILY_API_KEY}

      JWT_SECRET_KEY: ${JWT_SECRET_KEY}

    ports:
      - "8000:8000"


  # ==========================================================
  # FRONTEND
  # ==========================================================

  frontend:

    build:
      context: ./frontend

      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000

    container_name: fde-frontend

    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "3000:3000"


# ============================================================
# VOLUMES
# ============================================================

volumes:

  postgres_data: